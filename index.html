<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OTE Lead Capture</title>
    <style>
        :root {
            --ote-red: #cc292b;
            --ote-dark: #1a1a1a;
            --surface: #2d2d2d;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --border: #444;
            --error-red: #ff4c4c;
            --error-bg: rgba(255, 76, 76, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--ote-dark);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-top: 4px solid var(--ote-red);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"], 
        input[type="email"], 
        input[type="tel"], 
        input[type="number"],
        textarea {
            width: 100%;
            background: var(--ote-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--ote-red);
            box-shadow: 0 0 0 2px rgba(204, 41, 43, 0.2);
        }

        /* Error state classes applied via JavaScript */
        .input-error {
            border-color: var(--error-red) !important;
            background-color: var(--error-bg) !important;
        }

        .error-message {
            color: var(--error-red);
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
            font-weight: bold;
        }

        /* The binary highlight box */
        .contact-group {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed var(--border);
            margin-bottom: 20px;
        }

        .contact-group-label {
            font-size: 0.8rem;
            color: var(--ote-red);
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button {
            width: 100%;
            background: var(--ote-red);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
            background: #a82022;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        #toast.show {
            bottom: 30px;
        }

    </style>
</head>
<body>

    <div class="form-container">
        <div class="header">
            <h1>OTE Sales Lead</h1>
            <p>Capture customer data for retention</p>
        </div>

        <form id="leadForm">
            <div class="form-group">
                <label for="customerName">Customer Name</label>
                <input type="text" id="customerName" placeholder="e.g., Jane Doe" required>
            </div>

            <div class="form-group">
                <label for="bikeModel">Bike Model of Interest</label>
                <input type="text" id="bikeModel" placeholder="e.g., Santa Cruz Vala, Trek Rail+" required>
            </div>

            <div class="form-group">
                <label for="pricePoint">Target Price Point ($)</label>
                <input type="number" id="pricePoint" placeholder="e.g., 4500">
            </div>

            <!-- The Binary Requirement Zone -->
            <div class="contact-group">
                <div class="contact-group-label">Require at least ONE contact method</div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="jane@example.com">
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="(555) 555-5555">
                </div>
                
                <div id="contactError" class="error-message">⚠️ You must provide either an Email or a Mobile Number to save this lead.</div>
            </div>

            <div class="form-group">
                <label for="notes">Floor Notes / Interaction Details</label>
                <textarea id="notes" rows="4" placeholder="What trails do they ride? Are they waiting on financing?"></textarea>
            </div>

            <button type="submit">Save Lead Payload</button>
        </form>
    </div>

    <div id="toast">Lead Captured Successfully!</div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', function(e) {
            // Prevent the form from refreshing the page
            e.preventDefault();

            // Grab the contact fields
            const emailField = document.getElementById('email');
            const mobileField = document.getElementById('mobile');
            const errorText = document.getElementById('contactError');

            const emailValue = emailField.value.trim();
            const mobileValue = mobileField.value.trim();

            // Reset error states
            emailField.classList.remove('input-error');
            mobileField.classList.remove('input-error');
            errorText.style.display = 'none';

            // --- THE BINARY LOGIC CHECK ---
            if (!emailValue && !mobileValue) {
                // Both are empty. Block submission and highlight fields.
                emailField.classList.add('input-error');
                mobileField.classList.add('input-error');
                errorText.style.display = 'block';
                
                // Vibrate device if supported (great mobile UX feedback)
                if (navigator.vibrate) navigator.vibrate(200);
                
                return false; // Stops execution
            }

            // If we pass the check, compile the payload
            const leadData = {
                timestamp: new Date().toISOString(),
                name: document.getElementById('customerName').value.trim(),
                bike: document.getElementById('bikeModel').value.trim(),
                price: document.getElementById('pricePoint').value.trim(),
                email: emailValue,
                phone: mobileValue,
                notes: document.getElementById('notes').value.trim()
            };

            console.log("Payload ready for Google Apps Script:", leadData);

            /* 
             * FUTURE BACKEND HOOKUP:
             * This is where you will add the fetch() request to send 'leadData' 
             * to your Google Apps Script Web App URL once you build the spreadsheet.
             */

            // Show Success Notification
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);

            // Clear the form for the next customer
            document.getElementById('leadForm').reset();
        });
    </script>
</body>
</html>
